<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de caixa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#E9EEF2;--surface:#fff;--ink:#14232E;--muted:#5B6C78;--line:#CBD5DC;--accent:#0F766E;--on-accent:#fff;--danger:#B42318;--ok:#0F766E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A22;--surface:#16252F;--ink:#E6EEF2;--muted:#8FA3B0;--line:#2A3D49;--accent:#3DD6C0;--on-accent:#06231F;--danger:#FF8A7A;--ok:#3DD6C0}}
:root[data-theme="dark"]{--bg:#0E1A22;--surface:#16252F;--ink:#E6EEF2;--muted:#8FA3B0;--line:#2A3D49;--accent:#3DD6C0;--on-accent:#06231F;--danger:#FF8A7A;--ok:#3DD6C0}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2.1rem;line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:28px 0 10px;font-weight:600}
p{margin:0}.muted{color:var(--muted)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.link{background:none;border:0;padding:10px 0;color:var(--accent);font-weight:600}
.big{display:block;width:100%;margin-top:32px;padding:26px 20px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:1.5rem;font-weight:800;text-align:left}
.big.alt{margin-top:22px;padding:18px 20px;font-size:1.2rem;background:var(--surface);color:var(--ink);border:1.5px solid var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.note{margin-top:14px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
label{display:block;font-weight:600;margin:0 0 6px}
input[type=text]{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.25rem}
.row{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-bottom:16px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.chip{padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.submit{width:100%;padding:16px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:800;font-size:1.1rem}
.msg{min-height:1.5em;margin-top:10px;font-weight:600}.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item b{font-size:1.1rem}.item small{display:block;color:var(--muted)}
.rm{background:none;border:0;color:var(--muted);padding:8px 0 8px 8px;font-size:.9rem;text-decoration:underline}
.rm[data-armed]{color:var(--danger);font-weight:600}
.total{font-size:3rem;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.method{padding:10px 0}.method div{display:flex;justify-content:space-between}
.danger{margin-top:28px;width:100%;padding:14px;border:1.5px solid var(--danger);border-radius:10px;background:none;color:var(--danger);font-weight:600}
.danger[data-armed]{background:var(--danger);color:var(--bg)}
.rb{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}.rb:last-child{border-bottom:0}.rb small,.method small{display:block;color:var(--muted)}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--on-accent);margin-left:8px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{padding:12px}.stats b{display:block;font-size:1.2rem}.up{color:var(--ok)}.down{color:var(--danger)}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* CONFIGURAÇÃO DO ARMAZENAMENTO
   Deixe vazio para usar o modo local (dados salvos só no navegador do aparelho).
   Para compartilhar entre aparelhos, preencha com os dados do seu projeto Firebase (Firestore). */
var CAIXA_CONFIG={projectId:'controle-de-caixa-f04c2',apiKey:'AIzaSyDk6DnyZtbJDOOQEx-BpDLJjMGPOFnJDQs'};

(function(){
var cfg=CAIXA_CONFIG,fs=!!(cfg.projectId&&cfg.apiKey);
window.CAIXA_MODE=fs?'firestore':'local';
var LS='caixa:db:',H={'Content-Type':'application/json'};
var root='https://firestore.googleapis.com/v1/projects/'+cfg.projectId+'/databases/(default)/documents',K='?key='+cfg.apiKey;
function enc(o){var f={};Object.keys(o).forEach(function(k){var v=o[k];f[k]=typeof v==='number'?(Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v}):{stringValue:String(v)}});return {fields:f}}
function dec(f){var o={};Object.keys(f||{}).forEach(function(k){var v=f[k];o[k]=v.stringValue!==undefined?v.stringValue:Number(v.integerValue!==undefined?v.integerValue:v.doubleValue)});return o}
function rd(c){try{return JSON.parse(localStorage.getItem(LS+c))||{}}catch(e){return {}}}
function wr(c,o){localStorage.setItem(LS+c,JSON.stringify(o))}
function bad(){throw {code:'unavailable'}}
var B=fs?{
  list:async function(c,f,v){
    var q={from:[{collectionId:c}]};
    if(f)q.where={fieldFilter:{field:{fieldPath:f},op:'EQUAL',value:{stringValue:String(v)}}};
    var r=await fetch(root+':runQuery'+K,{method:'POST',headers:H,body:JSON.stringify({structuredQuery:q})});
    if(!r.ok)bad();
    return (await r.json()).filter(function(x){return x.document}).map(function(x){return {id:x.document.name.split('/').pop(),data:dec(x.document.fields)}});
  },
  get:async function(c,id){var r=await fetch(root+'/'+c+'/'+id+K);if(r.status===404)return null;if(!r.ok)bad();return dec((await r.json()).fields)},
  set:async function(c,id,d){var r=await fetch(root+'/'+c+'/'+id+K,{method:'PATCH',headers:H,body:JSON.stringify(enc(d))});if(!r.ok)bad()},
  del:async function(c,id){var r=await fetch(root+'/'+c+'/'+id+K,{method:'DELETE'});if(!r.ok)bad()}
}:{
  list:async function(c,f,v){var o=rd(c);return Object.keys(o).map(function(id){return {id:id,data:o[id]}}).filter(function(x){return !f||x.data[f]===v})},
  get:async function(c,id){return rd(c)[id]||null},
  set:async function(c,id,d){var o=rd(c);o[id]=d;wr(c,o)},
  del:async function(c,id){var o=rd(c);delete o[id];wr(c,o)}
};

var subs=[];
function run(s){
  return s.fetch().then(function(res){s.ok=true;var k=JSON.stringify(res.key);if(k!==s.last){s.last=k;s.next(res.snap)}})
    .catch(function(e){if(!s.ok&&s.err)s.err(e)});
}
function refresh(){subs.forEach(run)}
setInterval(refresh,3000);
function sub(fetcher,next,err){var s={fetch:fetcher,next:next,err:err,ok:false,last:null};subs.push(s);run(s);return function(){subs=subs.filter(function(x){return x!==s})}}
async function after(p){await p;refresh()}

function docRef(path){
  var p=path.split('/'),c=p[0],id=p[1];
  return {
    set:function(d){return after(B.set(c,id,d))},
    delete:function(){return after(B.del(c,id))},
    onSnapshot:function(n,e){return sub(async function(){var d=await B.get(c,id);return {key:d,snap:{exists:!!d,data:function(){return d||undefined}}}},n,e)}
  };
}
function query(c,f,v){
  return {
    where:function(f2,op,v2){return query(c,f2,v2)},
    onSnapshot:function(n,e){return sub(async function(){
      var l=await B.list(c,f,v);
      return {key:l,snap:{size:l.length,docs:l.map(function(x){return {id:x.id,data:function(){return x.data}}})}};
    },n,e)}
  };
}
var db={
  doc:docRef,
  collection:function(c){
    var q=query(c);
    q.add=function(d){var id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);return after(B.set(c,id,d))};
    return q;
  }
};
function loadJs(u){return new Promise(function(ok,no){var t=document.createElement('script');t.src=u;t.onload=ok;t.onerror=no;document.head.appendChild(t)})}
var fsdb=null;
async function fsDb(){
  if(fsdb)return fsdb;
  var b='https://www.gstatic.com/firebasejs/10.12.2/';
  await loadJs(b+'firebase-app-compat.js');await loadJs(b+'firebase-firestore-compat.js');
  firebase.initializeApp({apiKey:cfg.apiKey,projectId:cfg.projectId});
  fsdb=firebase.firestore();return fsdb;
}
window.claude={use:async function(n){
  if(n==='db')return fs?await fsDb():db;
  if(n==='user')return {can:async function(){return true}};
  return null;
}};
})();
</script>
<script>
var METHODS=['Dinheiro','Pix','Débito','Crédito'], app=document.getElementById('app');
var db=null, canWrite=true, dbState='loading', night=null, nightId='inicial', payments=[], loaded=false, unsubPay=null, chosen=null, view='';

function brl(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hm(t){return new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function parseValue(v){v=v.replace(/R\$|\s/g,'');if(v.indexOf(',')>-1)v=v.replace(/\./g,'').replace(',','.');var n=parseFloat(v);return isFinite(n)&&n>0?Math.round(n*100)/100:null}
function sum(l){return l.reduce(function(a,e){return a+e.value},0)}
function offlineNote(){
  if(window.CAIXA_MODE==='local')return '<div class="note">Modo local: os pagamentos ficam salvos só neste aparelho. Para compartilhar entre aparelhos, configure o Firebase no início do script.</div>';
  if(dbState==='off')return '<div class="note" role="alert">O armazenamento compartilhado não está disponível. Entre na sua conta Claude e abra o link de novo.</div>';
  return '';
}

function home(){
  app.innerHTML='<h1>Painel do restaurante</h1><p class="muted">Escolha uma área para começar.</p>'+
  '<button class="big" data-go="caixa">Controle de caixa</button><button class="big alt" data-go="historico">Histórico de noites</button><button class="big alt" data-go="analise">Análise semanal</button>'+offlineNote();
}
function caixa(){
  chosen=null;
  var form=canWrite&&dbState!=='off'?
  '<form class="card" id="f" style="margin-top:18px" novalidate>'+
  '<div class="row"><div><label for="mesa">Mesa</label><input id="mesa" type="text" inputmode="numeric" autocomplete="off"></div>'+
  '<div><label for="valor">Valor (R$)</label><input id="valor" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"></div></div>'+
  '<label id="lm">Forma de pagamento</label><div class="chips" role="group" aria-labelledby="lm">'+
  METHODS.map(function(m){return '<button type="button" class="chip" aria-pressed="false" data-m="'+m+'">'+m+'</button>'}).join('')+'</div>'+
  '<button class="submit" type="submit">Registrar pagamento</button><div class="msg" id="msg" role="status"></div></form>'
  : dbState==='off'?offlineNote()
  : '<div class="note">Você tem acesso somente para consulta. Peça permissão de colaborador para registrar pagamentos.</div>';
  app.innerHTML='<div class="top"><button class="link" data-go="">Voltar</button></div>'+
  '<h1>Controle de caixa</h1><p class="muted">Registre o que o garçom informar.</p>'+form+
  '<button class="big alt" data-go="pagamentos">Pagamentos da noite</button>';
  var m=document.getElementById('mesa');if(m)m.focus();
}
function itemsHtml(){
  if(!loaded)return '<p class="muted">Carregando pagamentos…</p>';
  if(!payments.length)return '<p class="muted">Nenhum pagamento registrado nesta noite.</p>';
  return payments.map(function(e){
    return '<div class="item"><div><b>Mesa '+esc(e.table)+'</b><small>'+esc(e.method)+' · '+hm(e.ts)+'</small></div>'+
    '<div><b>'+brl(e.value)+'</b>'+(canWrite?' <button class="rm" data-rm="'+esc(e.id)+'" data-label="Remover">Remover</button>':'')+'</div></div>';
  }).join('');
}
function pagamentos(){
  var t=sum(payments);
  var rows=METHODS.map(function(m){
    var s=sum(payments.filter(function(e){return e.method===m})), pc=t?Math.round(s/t*100):0;
    return '<div class="method"><div><span>'+m+'</span><b>'+brl(s)+'</b></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>';
  }).join('');
  var since=night&&night.since?night.since:(payments.length?payments[payments.length-1].ts:null);
  var sub=since?'Desde '+new Date(since).toLocaleDateString('pt-BR')+' às '+hm(since)+' · ':'';
  app.innerHTML='<div class="top"><button class="link" data-go="caixa">Voltar ao caixa</button></div>'+
  '<h1>Pagamentos da noite</h1><p class="muted">'+sub+payments.length+' pagamento'+(payments.length===1?'':'s')+'. Atualiza sozinho.</p>'+offlineNote()+
  '<div class="card" style="margin-top:18px"><p class="muted">Total recebido</p><div class="total">'+brl(t)+'</div></div>'+
  '<h2>Total por forma de pagamento</h2><div class="card">'+rows+'</div>'+
  '<h2>Todos os pagamentos</h2><div class="card">'+itemsHtml()+'</div>'+
  (canWrite&&dbState==='ok'?'<button class="danger" id="reset" data-label="Começar nova noite">Começar nova noite</button><p class="muted" style="margin-top:8px">A noite é arquivada no Histórico e os totais recomeçam do zero.</p>':'');
}
var MK=['dinheiro','pix','debito','credito'],DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],noites=[],loadedN=false,unsubDet=null,detId='',detPay=[],detOk=false,viewArg='';
function fdate(t){return new Date(t).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}
function fd2(t){return new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}
function pct(x){return (x*100).toFixed(1).replace('.',',')+'%'}
function wk(ts){var d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function nm(n){return MK.map(function(k){return n[k]||0})}
function backBtn(go,l){return '<div class="top"><button class="link" data-go="'+go+'">'+l+'</button></div>'}
function plural(n,s){return n+' '+s+(n===1?'':'s')}
function allNights(){
  var a=noites.slice();
  if(payments.length&&!a.some(function(n){return n.id===nightId})){
    var x={id:nightId,since:(night&&night.since)||payments[payments.length-1].ts,total:sum(payments),count:payments.length,live:true};
    METHODS.forEach(function(m,i){x[MK[i]]=sum(payments.filter(function(e){return e.method===m}))});a.unshift(x);
  }
  return a;
}
function methodRows(m,total){return METHODS.map(function(n,i){var p=total?Math.round(m[i]/total*100):0;
  return '<div class="method"><div><span>'+n+' · '+p+'%</span><b>'+brl(m[i])+'</b></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join('')}
function roItems(arr,ok){
  if(!ok)return '<p class="muted">Carregando pagamentos…</p>';
  if(!arr.length)return '<p class="muted">Nenhum pagamento nesta noite.</p>';
  return arr.map(function(e){return '<div class="item"><div><b>Mesa '+esc(e.table)+'</b><small>'+esc(e.method)+' · '+hm(e.ts)+'</small></div><b>'+brl(e.value)+'</b></div>'}).join('');
}
function historico(){
  var ns=allNights(),M={};
  ns.forEach(function(n){var d=new Date(n.since),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),o=M[k]||(M[k]={t:0,n:0});o.t+=n.total;o.n++});
  var ms=Object.keys(M).sort().reverse().map(function(k){var p=k.split('-');
    return '<div class="item"><div><b>'+p[1]+'/'+p[0]+'</b><small>'+plural(M[k].n,'noite')+'</small></div><b>'+brl(M[k].t)+'</b></div>'}).join('');
  var rows=ns.map(function(n){return '<button class="rb" data-go="'+(n.live?'pagamentos':'noite/'+esc(n.id))+'"><span><b>'+fdate(n.since)+'</b>'+(n.live?'<span class="tag">em andamento</span>':'')+'<small>'+plural(n.count,'pagamento')+'</small></span><b>'+brl(n.total)+'</b></button>'}).join('');
  app.innerHTML=backBtn('','Voltar')+'<h1>Histórico de noites</h1><p class="muted">Toque em uma noite para ver os pagamentos.</p>'+offlineNote()+
  (ns.length?'<h2>Noites</h2><div class="card">'+rows+'</div><h2>Por mês</h2><div class="card">'+ms+'</div>'
  :'<div class="note">'+(loadedN?'Nenhuma noite arquivada ainda. Use Começar nova noite ao fechar o caixa.':'Carregando…')+'</div>');
}
function noiteView(){
  var n=allNights().filter(function(x){return x.id===viewArg})[0];
  if(db&&detId!==viewArg){
    if(unsubDet)unsubDet();
    var id=detId=viewArg;detPay=[];detOk=false;
    unsubDet=db.collection('pagamentos').where('night','==',id).onSnapshot(function(s){
      if(detId!==id)return;
      detPay=s.docs.map(function(d){var x=d.data();return {id:d.id,table:x.table,method:x.method,value:Number(x.value)||0,ts:x.ts||0}}).sort(function(a,b){return b.ts-a.ts});
      detOk=true;if(view==='noite')render();
    },function(){detOk=true});
  }
  var body=n?'<p class="muted">'+plural(n.count,'pagamento')+'</p><div class="card" style="margin-top:18px"><p class="muted">Total recebido</p><div class="total">'+brl(n.total)+'</div></div>'+
    '<h2>Total por forma de pagamento</h2><div class="card">'+methodRows(nm(n),n.total)+'</div><h2>Pagamentos</h2><div class="card">'+roItems(detPay,detOk)+'</div>'
    :'<div class="note">'+(loadedN?'Noite não encontrada.':'Carregando…')+'</div>';
  app.innerHTML=backBtn('historico','Voltar ao histórico')+'<h1>'+(n?fdate(n.since):'Noite')+'</h1>'+body;
}
function analise(){
  var ns=allNights(),cur=wk(Date.now()),W={},DW=[0,0,0,0,0,0,0],DN=[0,0,0,0,0,0,0],MT=[0,0,0,0];
  ns.forEach(function(n){
    var k=wk(n.since),w=W[k]||(W[k]={start:k,total:0,count:0,nights:0});
    w.total+=n.total;w.count+=n.count;w.nights++;
    nm(n).forEach(function(v,i){MT[i]+=v});
    var d=new Date(n.since).getDay();DW[d]+=n.total;DN[d]++;
  });
  var weeks=Object.keys(W).map(function(k){return W[k]}).sort(function(a,b){return a.start-b.start});
  var cw=weeks.filter(function(w){return w.start<cur}),v=cw.map(function(w){return w.total}),nw=v.length,mu=mean(v);
  var sd=nw>1?Math.sqrt(v.reduce(function(a,x){return a+(x-mu)*(x-mu)},0)/(nw-1)):0;
  var so=v.slice().sort(function(a,b){return a-b}),med=nw?(nw%2?so[(nw-1)/2]:(so[nw/2-1]+so[nw/2])/2):0;
  var slope=0;if(nw>=3){var xm=(nw-1)/2,nu=0,de=0;v.forEach(function(y,i){nu+=(i-xm)*(y-mu);de+=(i-xm)*(i-xm)});slope=nu/de}
  var best=cw.slice().sort(function(a,b){return b.total-a.total})[0],worst=cw.slice().sort(function(a,b){return a.total-b.total})[0];
  function st(l,val,cls){return '<div class="card"><p class="muted">'+l+'</p><b'+(cls?' class="'+cls+'"':'')+'>'+val+'</b></div>'}
  var cards=nw?st('Média semanal',brl(mu))+st('Mediana semanal',brl(med))+
    st('Melhor semana',brl(best.total)+'<small class="muted"> '+fd2(best.start)+'</small>')+st('Pior semana',brl(worst.total)+'<small class="muted"> '+fd2(worst.start)+'</small>')+
    (nw>1?st('Desvio padrão',brl(sd))+st('Variação (CV)',mu?pct(sd/mu):'-'):'')+
    (nw>=3?st('Tendência',(slope>=0?'+':'-')+brl(Math.abs(slope))+'/semana',slope>=0?'up':'down'):''):'';
  var max=Math.max.apply(null,weeks.map(function(w){return w.total}).concat([1]));
  var wrows=weeks.slice().reverse().map(function(w){
    var i=weeks.indexOf(w),pv=weeks[i-1],chg=pv&&w.start<cur&&pv.total>0?(w.total-pv.total)/pv.total:null;
    return '<div class="method"><div><span><b>'+fd2(w.start)+' a '+fd2(w.start+6*864e5)+'</b>'+(w.start===cur?'<span class="tag">em andamento</span>':'')+'</span><b>'+brl(w.total)+'</b></div>'+
    '<div class="bar"><i style="width:'+Math.round(w.total/max*100)+'%"></i></div><small class="muted">'+plural(w.nights,'noite')+' · média '+brl(w.total/w.nights)+'/noite · ticket médio '+brl(w.count?w.total/w.count:0)+
    (chg!==null?' · <span class="'+(chg>=0?'up':'down')+'">'+(chg>=0?'+':'')+pct(chg)+'</span> vs. anterior':'')+'</small></div>';
  }).join('');
  var av=[1,2,3,4,5,6,0].map(function(d){return {d:d,a:DN[d]?DW[d]/DN[d]:0,n:DN[d]}}),am=Math.max.apply(null,av.map(function(x){return x.a}).concat([1]));
  var bestD=av.slice().sort(function(a,b){return b.a-a.a})[0];
  var drows=av.map(function(x){return '<div class="method"><div><span>'+DOW[x.d]+(x.n?' · '+plural(x.n,'noite'):'')+'</span><b>'+brl(x.a)+'</b></div><div class="bar"><i style="width:'+Math.round(x.a/am*100)+'%"></i></div></div>'}).join('');
  var tt=MT.reduce(function(a,b){return a+b},0);
  app.innerHTML=backBtn('','Voltar')+'<h1>Análise semanal</h1><p class="muted">Semanas de segunda a domingo, pela data de início de cada noite.</p>'+offlineNote()+
  (!ns.length?'<div class="note">'+(loadedN?'Ainda não há noites arquivadas. Use Começar nova noite ao fechar o caixa.':'Carregando…')+'</div>':
  '<h2>Resumo das semanas completas</h2>'+(nw?'<div class="stats">'+cards+'</div><p class="muted" style="margin-top:8px">A semana em andamento fica fora destes cálculos.'+(nw<3?' A tendência aparece com 3 semanas completas.':'')+'</p>':'<div class="note">Os cálculos aparecem quando houver ao menos uma semana completa.</div>')+
  '<h2>Total por semana</h2><div class="card">'+wrows+'</div>'+
  '<h2>Média por dia da semana</h2><div class="card">'+drows+'</div>'+(bestD.a?'<p class="muted" style="margin-top:8px">Melhor dia em média: '+DOW[bestD.d]+'.</p>':'')+
  '<h2>Formas de pagamento (todo o período)</h2><div class="card">'+methodRows(MT,tt)+'</div>');
}
function render(){
  var p=location.hash.replace('#/','').split('/');
  view=['caixa','pagamentos','historico','analise','noite'].indexOf(p[0])>-1?p[0]:'';
  viewArg=decodeURIComponent(p[1]||'');
  if(view!=='noite'&&unsubDet){unsubDet();unsubDet=null;detId=''}
  if(view==='caixa')caixa();else if(view==='pagamentos')pagamentos();else if(view==='historico')historico();else if(view==='analise')analise();else if(view==='noite')noiteView();else home();
}
function route(){render();window.scrollTo(0,0)}


function subscribePayments(id){
  if(unsubPay&&id===nightId)return;
  if(unsubPay)unsubPay();
  nightId=id;loaded=false;payments=[];
  unsubPay=db.collection('pagamentos').where('night','==',id).onSnapshot(function(snap){
    payments=snap.docs.map(function(d){var x=d.data();return {id:d.id,table:x.table,method:x.method,value:Number(x.value)||0,ts:x.ts||0}})
      .sort(function(a,b){return b.ts-a.ts});
    loaded=true;if(view==='pagamentos')pagamentos();else if(view==='historico'||view==='analise')render();
  },function(){dbState='off';loaded=true;route()});
}
async function init(){
  route();
  var d=null;try{d=await claude.use('db')}catch(e){}
  if(!d){dbState='off';route();return}
  db=d;dbState='ok';
  try{var u=await claude.use('user');if(u){var c=await u.can('data.write');if(c===false)canWrite=false}}catch(e){}
  db.collection('noites').onSnapshot(function(sn){noites=sn.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return b.since-a.since});loadedN=true;if(view==='historico'||view==='analise'||view==='noite')render()},function(){loadedN=true});
  db.doc('config/noite').onSnapshot(function(s){
    night=s.exists?s.data():null;
    subscribePayments(night&&night.id?night.id:'inicial');
    if(view==='pagamentos')pagamentos();
  },function(){dbState='off';route()});
  if(view!=='caixa'||!document.getElementById('mesa')||!document.getElementById('mesa').value)route();
}

document.addEventListener('click',async function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-go')){location.hash='#/'+b.getAttribute('data-go');return}
  if(b.dataset.m){chosen=b.dataset.m;document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===b?'true':'false')});return}
  if(b.hasAttribute('data-rm')||b.id==='reset'){
    if(!b.hasAttribute('data-armed')){
      b.setAttribute('data-armed','1');b.textContent='Toque de novo para confirmar';
      setTimeout(function(){if(b.isConnected){b.removeAttribute('data-armed');b.textContent=b.dataset.label}},3500);return}
    b.disabled=true;
    try{
      if(b.id==='reset'){
        if(payments.length){
          var a={id:nightId,since:(night&&night.since)||payments[payments.length-1].ts,end:Date.now(),total:sum(payments),count:payments.length};
          METHODS.forEach(function(m,i){a[MK[i]]=sum(payments.filter(function(e){return e.method===m}))});
          await db.doc('noites/'+nightId).set(a);
        }
        await db.doc('config/noite').set({id:'n'+Date.now(),since:Date.now()});
      }
      else await db.doc('pagamentos/'+b.getAttribute('data-rm')).delete();
    }catch(e){b.disabled=false;b.removeAttribute('data-armed');b.textContent='Não foi possível. Tentar de novo';if(e&&(e.code==='invalid_argument'||e.code==='permission-denied')){canWrite=false}}
  }
});
document.addEventListener('submit',async function(ev){
  ev.preventDefault();
  var mesa=document.getElementById('mesa'),valor=document.getElementById('valor'),msg=document.getElementById('msg'),btn=ev.target.querySelector('.submit');
  var t=mesa.value.trim(),v=parseValue(valor.value);
  function fail(s,el){msg.className='msg err';msg.textContent=s;if(el)el.focus()}
  if(!t)return fail('Informe o número da mesa.',mesa);
  if(!chosen)return fail('Escolha a forma de pagamento.');
  if(v===null)return fail('Informe um valor maior que zero, como 45,50.',valor);
  if(!db)return fail('Sem conexão com o armazenamento compartilhado.');
  btn.disabled=true;var m=chosen;
  try{
    await db.collection('pagamentos').add({night:nightId,table:t,method:m,value:v,ts:Date.now()});
    msg.className='msg ok';msg.textContent='Registrado: mesa '+t+', '+m+', '+brl(v)+'.';
    mesa.value='';valor.value='';chosen=null;
    document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed','false')});
    mesa.focus();
  }catch(e){
    fail(e&&(e.code==='invalid_argument'||e.code==='permission-denied')?'Você não tem permissão para registrar pagamentos.':'Não foi possível registrar. Tente de novo.');
  }
  btn.disabled=false;
});
window.addEventListener('hashchange',route);init();
</script>
