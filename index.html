<style>
:root{color-scheme:light;--bg:#F8F0E6;--surface:#F8F0E6;--field:#F8F0E6;--ink:#003070;--muted:#4A6088;--line:rgba(0,48,112,.2);--accent:#003070;--on-accent:#FFFFFF;--brand:#003070;--on-brand:#F8F0E6;--danger:#B3203A;--ok:#1B7A4B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2.1rem;line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:28px 0 10px;font-weight:600}
p{margin:0}.muted{color:var(--muted)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.link{background:none;border:0;padding:10px 0;color:var(--accent);font-weight:600}
.big{display:block;width:100%;margin-top:32px;padding:26px 20px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:1.5rem;font-weight:800;text-align:left}
.big.alt{margin-top:22px;padding:18px 20px;font-size:1.2rem;background:var(--surface);color:var(--ink);border:1.5px solid var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.note{margin-top:14px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
label{display:block;font-weight:600;margin:0 0 6px}
input[type=text]{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.25rem}
.row{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-bottom:16px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.chip{padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.submit{width:100%;padding:16px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:800;font-size:1.1rem}
.msg{min-height:1.5em;margin-top:10px;font-weight:600}.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item b{font-size:1.1rem}.item small{display:block;color:var(--muted)}
.rm{background:none;border:0;color:var(--muted);padding:8px 0 8px 8px;font-size:.9rem;text-decoration:underline}
.rm[data-armed]{color:var(--danger);font-weight:600}
.total{font-size:3rem;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.method{padding:10px 0}.method div{display:flex;justify-content:space-between}
.danger{margin-top:28px;width:100%;padding:14px;border:1.5px solid var(--danger);border-radius:10px;background:none;color:var(--danger);font-weight:600}
.danger[data-armed]{background:var(--danger);color:var(--bg)}
.rb{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}.rb:last-child{border-bottom:0}.rb small,.method small{display:block;color:var(--muted)}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--on-accent);margin-left:8px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{padding:12px}.stats b{display:block;font-size:1.2rem}.up{color:var(--ok)}.down{color:var(--danger)}
main{padding-top:68px}
h1{color:var(--accent)}.total{color:var(--accent)}
.bar i{background:var(--brand)}
.tag{background:var(--brand);color:var(--on-brand)}
.submit{background:var(--accent);color:var(--on-accent)}

/* ===== Responsivo: celular, tablet e notebook ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bev.on .bq{display:flex}
.bev:active{transform:scale(.97)}
@media (hover:hover){.bev:hover{border-color:var(--accent);background:#fff}}
/* títulos dos grupos de bebidas */
.bevh{grid-column:1/-1;font-weight:800;font-size:.95rem;color:var(--accent);margin:10px 2px 0;border-bottom:2px solid rgba(0,48,112,.18);padding-bottom:3px}
.bevh:first-child{margin-top:0}
@media (min-width:700px){.bevgrid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}}
@media (max-width:380px){.bevgrid{gap:8px}.bev .bn{font-size:.72rem}}
/* fast food em quadrados com foto */
.bevgrid.ffgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bev.ff{aspect-ratio:auto;justify-content:flex-start;gap:4px;padding:5px 5px 7px}
.bev.ff .bi{flex:none;width:100%;aspect-ratio:1/1;border-radius:9px;background:#fff}
.bev.ff .bi img{width:100%;height:100%;object-fit:cover}
.bev.ff .bi svg{width:30px;height:30px}
.bev.ff .bn{font-size:.7rem;line-height:1.15}
.bev.ff .bp{font-size:.76rem;font-weight:800;opacity:.85}
@media (min-width:700px){.bevgrid.ffgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
@media (max-width:380px){.bevgrid.ffgrid{gap:6px}.bev.ff .bn{font-size:.66rem}}

<script>
/* CONFIGURAÇÃO DO ARMAZENAMENTO
   Deixe vazio para usar o modo local (dados salvos só no navegador do aparelho).
   Para compartilhar entre aparelhos, preencha com os dados do seu projeto Firebase (Firestore). */
var CAIXA_CONFIG={projectId:'controle-de-caixa-f04c2',apiKey:'AIzaSyDk6DnyZtbJDOOQEx-BpDLJjMGPOFnJDQs'};

(function(){
var cfg=CAIXA_CONFIG,fs=!!(cfg.projectId&&cfg.apiKey);
window.CAIXA_MODE=fs?'firestore':'local';
var LS='caixa:db:',H={'Content-Type':'application/json'};
var root='https://firestore.googleapis.com/v1/projects/'+cfg.projectId+'/databases/(default)/documents',K='?key='+cfg.apiKey;
function enc(o){var f={};Object.keys(o).forEach(function(k){var v=o[k];f[k]=typeof v==='number'?(Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v}):{stringValue:String(v)}});return {fields:f}}
function dec(f){var o={};Object.keys(f||{}).forEach(function(k){var v=f[k];o[k]=v.stringValue!==undefined?v.stringValue:Number(v.integerValue!==undefined?v.integerValue:v.doubleValue)});return o}
function rd(c){try{return JSON.parse(localStorage.getItem(LS+c))||{}}catch(e){return {}}}
function wr(c,o){localStorage.setItem(LS+c,JSON.stringify(o))}
function bad(){throw {code:'unavailable'}}
var B=fs?{
  list:async function(c,f,v){
    var q={from:[{collectionId:c}]};
    if(f)q.where={fieldFilter:{field:{fieldPath:f},op:'EQUAL',value:{stringValue:String(v)}}};
    var r=await fetch(root+':runQuery'+K,{method:'POST',headers:H,body:JSON.stringify({structuredQuery:q})});
    if(!r.ok)bad();
    return (await r.json()).filter(function(x){return x.document}).map(function(x){return {id:x.document.name.split('/').pop(),data:dec(x.document.fields)}});
  },
  get:async function(c,id){var r=await fetch(root+'/'+c+'/'+id+K);if(r.status===404)return null;if(!r.ok)bad();return dec((await r.json()).fields)},
  set:async function(c,id,d){var r=await fetch(root+'/'+c+'/'+id+K,{method:'PATCH',headers:H,body:JSON.stringify(enc(d))});if(!r.ok)bad()},
  del:async function(c,id){var r=await fetch(root+'/'+c+'/'+id+K,{method:'DELETE'});if(!r.ok)bad()}
}:{
  list:async function(c,f,v){var o=rd(c);return Object.keys(o).map(function(id){return {id:id,data:o[id]}}).filter(function(x){return !f||x.data[f]===v})},
  get:async function(c,id){return rd(c)[id]||null},
  set:async function(c,id,d){var o=rd(c);o[id]=d;wr(c,o)},
  del:async function(c,id){var o=rd(c);delete o[id];wr(c,o)}
};

var subs=[];
function run(s){
  return s.fetch().then(function(res){s.ok=true;var k=JSON.stringify(res.key);if(k!==s.last){s.last=k;s.next(res.snap)}})
    .catch(function(e){if(!s.ok&&s.err)s.err(e)});
}
function refresh(){subs.forEach(run)}
setInterval(refresh,3000);
function sub(fetcher,next,err){var s={fetch:fetcher,next:next,err:err,ok:false,last:null};subs.push(s);run(s);return function(){subs=subs.filter(function(x){return x!==s})}}
async function after(p){await p;refresh()}

function docRef(path){
  var p=path.split('/'),c=p[0],id=p[1];
  return {
    set:function(d){return after(B.set(c,id,d))},
    update:function(d){return after((async function(){var o=(await B.get(c,id))||{};Object.keys(d).forEach(function(k){o[k]=d[k]});await B.set(c,id,o)})())},
    inc:function(f,n){return after((async function(){var d=(await B.get(c,id))||{};d[f]=Math.round(((d[f]||0)+n)*1000)/1000;await B.set(c,id,d)})())},
    delete:function(){return after(B.del(c,id))},
    onSnapshot:function(n,e){return sub(async function(){var d=await B.get(c,id);return {key:d,snap:{exists:!!d,data:function(){return d||undefined}}}},n,e)}
  };
}
function query(c,f,v,ob,od,lim){
  return {
    where:function(f2,op,v2){return query(c,f2,v2,ob,od,lim)},
    orderBy:function(o,d){return query(c,f,v,o,d||'asc',lim)},
    limit:function(n){return query(c,f,v,ob,od,n)},
    onSnapshot:function(n,e){return sub(async function(){
      var l=await B.list(c,f,v);
      if(ob)l=l.slice().sort(function(a,b){var x=a.data[ob],y=b.data[ob];return (x>y?1:x<y?-1:0)*(od==='desc'?-1:1)});
      if(lim)l=l.slice(0,lim);
      return {key:l,snap:{size:l.length,docs:l.map(function(x){return {id:x.id,data:function(){return x.data}}})}};
    },n,e)}
  };
}
var db={
  doc:docRef,
  collection:function(c){
    var q=query(c);
    q.add=function(d){var id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);return after(B.set(c,id,d))};
    return q;
  }
};
function loadJs(u){return new Promise(function(ok,no){var t=document.createElement('script');t.src=u;t.onload=ok;t.onerror=no;document.head.appendChild(t)})}
var fsdb=null;
async function fsDb(){
  if(fsdb)return fsdb;
  var b='https://www.gstatic.com/firebasejs/10.12.2/';
  await loadJs(b+'firebase-app-compat.js');await loadJs(b+'firebase-auth-compat.js');await loadJs(b+'firebase-firestore-compat.js');
  firebase.initializeApp({apiKey:cfg.apiKey,projectId:cfg.projectId,authDomain:cfg.projectId+'.firebaseapp.com'});
  fsdb=firebase.firestore();return fsdb;
}
window.claude={use:async function(n){
  if(n==='db')return fs?await fsDb():db;
  if(n==='user')return {can:async function(){return true}};
  return null;
}};
})();
</script>

function ensureMovs(){if(movsUnsub||!db)return;movsUnsub=db.collection('movs').orderBy('ts','desc').limit(100).onSnapshot(function(sn){movs=sn.docs.map(function(d){var x=d.data();x.id=d.id;return x});movsOk=true;if(view==='estoque'&&stTab==='hist')estoque()},function(){movsOk=true})}

async function confirmMove(b){
  var msg=document.getElementById('smsg'),it=items.filter(function(x){return x.id===openS.id})[0];
  function fail(s){msg.className='msg err';msg.textContent=s}
  var v=parseQty(stQty),t=openS.type,cur=stock[it.id]||0;
  if(v===null||(t!=='set'&&v<=0))return fail(t==='set'?'Informe a quantidade contada (pode ser 0).':'Informe uma quantidade maior que zero.');
  if(t==='out'&&v>cur+1e-9)return fail('Estoque insuficiente: há '+fmtQ(cur)+' '+it.unit+'. Use Contagem para corrigir o saldo.');
  if(!db)return fail('Sem conexão com o armazenamento compartilhado.');
  var paid=null;if(t==='in'&&stPaid.trim()!==''){paid=parseValue(stPaid);if(paid===null)return fail('Valor pago inválido. Informe o total da compra ou deixe vazio.')}
  var delta=t==='in'?v:t==='out'?-v:Math.round((v-cur)*1000)/1000;
  b.disabled=true;
  try{
    var ref=db.doc('estoque/'+it.id);
    if(typeof ref.inc==='function')await ref.inc('qty',delta);else await ref.set({qty:firebase.firestore.FieldValue.increment(delta)},{merge:true});
    await db.collection('movs').add({item:it.id,name:it.name,unit:it.unit,type:t,qty:v,delta:delta,note:stNote.trim(),paid:paid||0,ts:Date.now()});
    var costMsg='';
    if(paid>0){var oc=it.cost>0?it.cost:0,bs=Math.max(cur,0),up=paid/v,nc=(oc>0&&bs>0)?(bs*oc+v*up)/(bs+v):up;nc=Math.round(nc*10000)/10000;it.cost=nc;saveItems();syncFichaItem(it);costMsg=' Custo médio: '+brl(nc)+'/'+it.unit+'.'}
    stMsg=TL[t]+' registrada: '+it.name+' ('+(t==='set'?'saldo '+fmtQ(v):(delta>0?'+':'−')+fmtQ(Math.abs(delta)))+' '+it.unit+').'+costMsg;
    openS=null;stQty='';stNote='';stPaid='';estoque();
    setTimeout(function(){stMsg='';var e=document.getElementById('stmsg');if(e)e.textContent=''},5000);
  }catch(e){b.disabled=false;fail('Não foi possível registrar. Tente de novo.')}
}
function handleStock(b){
  var d=b.dataset;
  if(d.st){stTab=d.st;openS=null;estoque();return true}
  if(d.sa){openS=openS&&openS.id===d.sa&&openS.type===d.t?null:{id:d.sa,type:d.t};stQty='';stNote='';stPaid='';estoque();var q=document.getElementById('sq');if(q)q.focus();return true}
  if(d.sok){confirmMove(b);return true}
  if(d.fcard){fcard=fcard===d.fcard?'':d.fcard;estoque();return true}
  if(d.bauto){ligarPeloNome();return true}
  if(d.ball){if(arm(b))return true;var bc2=0;menu.filter(function(m){return m.cat==='Bebidas'&&!linkOf(m.id)}).forEach(function(m){var cat2=/cerveja|brahma|skol|stella|antarctica|bohemia|heineken|budweiser/.test(norm(m.name))?'Cervejas':'Refrigerantes',n2=newStockItem(m.name,cat2,'un');fichas[fKey('m',m.id)]=[{i:n2.id,q:1,n:n2.name,u:n2.unit}];bc2++});if(bc2){saveFichas();toast(bc2+' item(ns) criado(s) no estoque e ligado(s).',3200)}estoque();return true}
  if(d.bnew){var bm=menu.filter(function(m){return m.id===d.bnew})[0];if(bm){var bcat=/cerveja|brahma|skol|stella|antarctica|bohemia|heineken|budweiser/.test(norm(bm.name))?'Cervejas':'Refrigerantes',nit=newStockItem(bm.name,bcat,'un');fichas[fKey('m',bm.id)]=[{i:nit.id,q:1,n:nit.name,u:nit.unit}];saveFichas();toast('Criado no estoque: '+nit.name,2600);estoque()}return true}
  if(d.pnew){var np=newStockItem('Pão de hambúrguer','Insumos','un');paoSel=np.id;estoque();return true}
  if(d.paosug){var pb=paoBun();if(pb){var pit=itemOf(pb);menu.filter(function(m){return m.cat==='Fast food'&&paoSugg(m)&&!paoRows(m.id,pb).length}).forEach(function(m){var pk=fKey('m',m.id);(fichas[pk]=fichas[pk]||[]).push({i:pb,q:1,n:pit?pit.name:'',u:pit?pit.unit:''})});saveFichas();estoque()}return true}
  if(d.paoclr){var pc=paoBun();if(pc){menu.filter(function(m){return m.cat==='Fast food'}).forEach(function(m){var pk=fKey('m',m.id);if(!fichas[pk])return;var pr=fichas[pk].filter(function(x){return x.i!==pc});if(pr.length)fichas[pk]=pr;else delete fichas[pk]});saveFichas();estoque()}return true}
  if(d.fo){openF=openF===d.fo?null:d.fo;estoque();return true}
  if(d.fadd){(fichas[d.fadd]=fichas[d.fadd]||[]).push({i:'',q:0,n:'',u:''});saveFichas();estoque();return true}
  if(d.fdel){var fr=fichas[d.fdel];if(fr){fr.splice(+d.fx,1);if(!fr.length)delete fichas[d.fdel]}saveFichas();estoque();return true}
  if(d.xdel){if(arm(b))return true;items=items.filter(function(x){return x.id!==d.xdel});Object.keys(fichas).forEach(function(k){fichas[k]=fichas[k].filter(function(r){return r.i!==d.xdel});if(!fichas[k].length)delete fichas[k]});saveFichas();saveItems();estoque();return true}
  if(b.id==='xadd'){
    var n=document.getElementById('xn'),nm2=n.value.trim();if(!nm2){n.focus();return true}
    items.push({id:'e'+Date.now(),cat:document.getElementById('xc').value,name:nm2,unit:document.getElementById('xu').value,min:0});saveItems();estoque();return true}
  return false;
}
function editItem(t,d){
  var it=items.filter(function(x){return x.id===d.xid})[0];if(!it)return;
  if(d.xf==='name'){var v=t.value.trim();if(v)it.name=v;else t.value=it.name}
  else if(d.xf==='unit'){var u=t.value.trim();if(u)it.unit=u;else t.value=it.unit}
  else if(d.xf==='cost'){var rc=t.value.trim(),cv=rc===''?0:parseValue(rc);if(cv===null){t.value=it.cost>0?fmtIn(it.cost):'';return}it.cost=cv;t.value=cv>0?fmtIn(cv):''}
  else{var raw=t.value.trim(),m=raw===''?0:parseQty(raw);if(m===null){t.value=it.min>0?fmtQ(it.min):'';return}it.min=m;t.value=m>0?fmtQ(m):''}
  saveItems();syncFichaItem(it);
}

var fiados=[],fiSel='',fiSearch='';

function fiadoDevedores(){var M=fiadoClientes();return Object.keys(M).map(function(k){return M[k]}).filter(function(c){return c.saldo>0.004})}

function logAudit(tipo,d){if(!db)return;try{Promise.resolve(db.collection('auditoria').add(Object.assign({tipo:tipo,by:userName||'',ts:Date.now(),night:nightId},d||{}))).catch(function(){})}catch(e){}}
function fiadoList(){
  var q=fiKey(fiSearch),all=fiadoDevedores(),l=all.filter(function(c){return !q||c.key.indexOf(q)>-1}).sort(function(a,b){return b.saldo-a.saldo});

function gParseLine(line){
  var p=line.split(/\t|;|\|/).map(function(x){return x.trim()});
  if(p.length<5)return {err:'faltam campos (data | fornecedor | descrição | categoria | valor)'};
  var m,iso=null;
  if(m=p[0].match(/^(\d{4})-(\d{2})-(\d{2})$/))iso=p[0];else if(m=p[0].match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))iso=m[3]+'-'+pad2(m[2])+'-'+pad2(m[1]);
  var dt=iso?new Date(iso+'T12:00:00'):null;
  if(!dt||isNaN(dt)||dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate())!==iso)return {err:'data inválida “'+p[0]+'”'};
  var v=parseValue(p[4]);if(v===null)return {err:'valor inválido “'+p[4]+'”'};
  var cat=gCats.filter(function(c){return norm(c)===norm(p[3])})[0],warn='';
  if(!cat){cat='Outros';if(p[3])warn='categoria “'+p[3]+'” não existe → Outros'}
  var forma=GFORMAS.filter(function(f){return norm(f)===norm(p[5]||'')})[0]||'';
  return {date:iso,fornecedor:p[1].slice(0,60),desc:p[2].slice(0,100),cat:cat,valor:v,forma:forma,warn:warn};
}

}

function handleGastos(b){

  if(d.gw){gSem=gAddDays(gSem||gMonday(gHoje()),7*Number(d.gw));gastosView();return true}

  if(d.gm){gMes=gMesShift(gMes||gMesAtual(),Number(d.gm));gFilter='';gastosView();return true}

  if(d.gdel){if(arm(b))return true;var id=d.gdel;db.doc('gastos/'+id).delete().then(function(){db.doc('gastofotos/'+id).delete().catch(function(){})}).catch(function(){});closeContas();toast('Gasto excluído',2000);return true}
  if(d.gfrm){gFoto=null;gFotoChanged=true;var n=document.getElementById('gfnote');if(n)n.textContent='A foto será removida ao salvar.';return true}
  if(b.id==='gsave'){gSave(b);return true}
  if(d.gimpread){gImpRead();return true}
  if(d.gimpok){gImpSave(b);return true}
  if(d.gcadd){
    var inp=document.getElementById('gcnew'),m=document.getElementById('gcmsg'),nm2=inp.value.trim().replace(/\s+/g,' ').slice(0,30);
    function fail(t){m.className='msg err';m.textContent=t;inp.focus()}
    if(!nm2){fail('Informe o nome da categoria.');return true}
    if(gCats.some(function(c){return norm(c)===norm(nm2)})){fail('Essa categoria já existe.');return true}
    if(!db){fail('Sem conexão com o armazenamento compartilhado.');return true}
    saveGCats(gCats.concat([nm2])).then(function(){toast('Categoria adicionada',1800);gastosView()}).catch(function(){fail('Não foi possível salvar. Tente de novo.')});return true}
  if(d.gcrm){if(arm(b))return true;saveGCats(gCats.filter(function(c){return c!==d.gcrm})).then(function(){gastosView()}).catch(function(){toast('Não foi possível remover',2000)});return true}
  return false;
}

function pxWrap(s,n){
  var out=[],cur='';
  pxText(s).split(/\s+/).filter(Boolean).forEach(function(w){
    while(w.length>n){if(cur){out.push(cur);cur=''}out.push(w.slice(0,n));w=w.slice(n)}
    if(!cur)cur=w;else if((cur+' '+w).length<=n)cur+=' '+w;else{out.push(cur);cur=w}
  });
  if(cur)out.push(cur);return out.length?out:[''];
}

function pxPadL(s,n){s=pxText(s);return new Array(Math.max(0,n-s.length)+1).join(' ')+s}
function pxN(v){return Number(v).toFixed(2).replace('.',',')}
function pxRuler(cols){var s='';for(var i=1;i<=cols;i++)s+=String(i%10);return s}
function pxB(cols){
  var B=[],o={B:B,bar:new Array(cols+1).join('='),dash:new Array(cols+1).join('-')};
  o.raw=function(){for(var i=0;i<arguments.length;i++)B.push(arguments[i])};
  o.txt=function(s){s=pxText(s);for(var i=0;i<s.length;i++)B.push(s.charCodeAt(i))};
  o.ln=function(s){o.txt(s);B.push(10)};
  o.lr=function(l,r){r=pxText(r);var ls=pxWrap(l,Math.max(8,cols-r.length-1));ls.forEach(function(s,i){if(i<ls.length-1){o.ln(s);return}o.ln(s+new Array(Math.max(1,cols-s.length-r.length)+1).join(' ')+r)})};
  o.bold=function(on){o.raw(0x1B,0x45,on?1:0)};o.size=function(n){o.raw(0x1D,0x21,n)};o.align=function(a){o.raw(0x1B,0x61,a)};
  o.end=function(wide){o.raw(0x1B,0x64,wide?5:4);if(wide&&printCfg().cut!==false)o.raw(0x1D,0x56,0x42,0x00)};
  return o;
}

async function printList(list){

    var all=[];list.forEach(function(o){all=all.concat(ticketBytes(o,c.cols))});

function bevImg(m){

}

}

function bevGroup(m){
  var t=toks(m.name),has=function(l){return l.some(function(w){return t.indexOf(w)>-1})};
  if(has(BEV_REFRI))return 0;if(has(BEV_CERV))return 1;
  var r=fRows(fKey('m',m.id)),it=(r.length===1&&r[0].i)?itemOf(r[0].i):null;

function bevGrouped(list){
  var G=[[],[],[]],N=['Refrigerantes','Cervejas','Outras bebidas'];
  list.forEach(function(m){G[bevGroup(m)].push(m)});
  return G.map(function(g,i){if(!g.length)return '';g.sort(function(a,b){return a.name.localeCompare(b.name,'pt',{sensitivity:'base'})});return '<div class="bevh">'+N[i]+'</div>'+g.map(bevTile).join('')}).join('');
}

  unsubPay=db.collection('pagamentos').where('night','==',id).onSnapshot(function(snap){
    payments=snap.docs.map(function(d){var x=d.data();return {id:d.id,table:x.table,method:x.method,value:Number(x.value)||0,conta:x.conta||'',fid:x.fid||'',ts:x.ts||0}})

}

async function doLogin(ev){
  var e=document.getElementById('le').value.trim(),p=document.getElementById('lp').value,m=document.getElementById('lmsg'),b=ev.target.querySelector('.submit');
  function fail(s){m.className='msg err';m.textContent=s}
  if(!e||!p)return fail('Informe usuário e senha.');
  loginFlag=true;e=toEmail(e);b.disabled=true;
  try{await firebase.auth().signInWithEmailAndPassword(e,p)}
  catch(err){b.disabled=false;loginFlag=false;var c=(err&&err.code)||'';fail(c==='auth/too-many-requests'?'Muitas tentativas. Aguarde alguns minutos e tente de novo.':c==='auth/network-request-failed'?'Sem conexão com a internet.':c==='auth/invalid-email'?'Usuário inválido.':'Usuário ou senha incorretos.')}
}

  if(b.dataset.out||b.id==='fabout'){firebase.auth().signOut().then(function(){location.hash='';location.reload()});return true}

}

    db.doc('config/pin').onSnapshot(function(sn){pinApplyCfg(sn.exists?sn.data():null);if(PIN_VIEWS.indexOf(view)>-1&&(document.getElementById('pinpad')||document.getElementById('pinwait')||pinLocked()))render()},function(){if(pinCfg===null)pinCfg=false;if(PIN_VIEWS.indexOf(view)>-1&&document.getElementById('pinwait'))render()});
    db.collection('fiado').onSnapshot(function(sn){fiados=sn.docs.map(function(d){var x=d.data();return {id:d.id,tipo:x.tipo==='c'?'c':'d',cliente:String(x.cliente||''),ckey:x.ckey||fiKey(x.cliente||''),value:Number(x.value)||0,conta:x.conta||'',table:x.table||'',itens:x.itens||'',method:x.method||'',night:x.night||'',ts:x.ts||0,by:x.by||''}}).sort(function(a,b){return a.ts-b.ts});refreshContas()},function(){});
    db.collection('noites').onSnapshot(function(sn){noites=sn.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return b.since-a.since});loadedN=true;if(view==='historico'||view==='analise'||view==='noite')render()},function(){loadedN=true});
  }
  if(role==='caixa')db.doc('config/gastosCats').onSnapshot(function(s){if(s.exists){try{var a=JSON.parse(s.data().json);if(Array.isArray(a)&&a.length){if(a.indexOf('Outros')<0)a.push('Outros');gCats=a}}catch(e){}}if(view==='gastos'&&gTab==='cats')gastosView()},function(){});
  db.doc('config/mesas').onSnapshot(function(s){var l=[];if(s.exists){try{l=JSON.parse((s.data()||{}).json||'[]')}catch(e){l=[]}}l=Array.isArray(l)?l:[];var same=JSON.stringify(l)===JSON.stringify(extraMesas);extraMesas=l;if(same)return;if(view==='pedidos'&&!pedMesa)updPedLive();if(cOpen&&cMode==='mesa')modalBody()},function(){});
  db.doc('config/cardapio').onSnapshot(function(s){if(s.exists){var x=s.data();if(x&&x.json&&x.json!==JSON.stringify(menu)){try{menu=JSON.parse(x.json)}catch(e){return}if(view==='pedidos')updItems();else if(view==='cardapio')cardapio()}}},function(){});
  db.doc('config/adicionais').onSnapshot(function(s){if(s.exists){var x=s.data();if(x&&x.json&&x.json!==JSON.stringify(addons)){try{var a=JSON.parse(x.json);if(Array.isArray(a)){addons=a;if(view==='pedidos')updCart();else if(view==='cardapio')cardapio()}}catch(e){}}}},function(){});
  db.doc('config/fichas').onSnapshot(function(s){if(s.exists){var x=s.data();if(x&&x.json&&x.json!==JSON.stringify(fichas)){try{var f=JSON.parse(x.json);if(f&&typeof f==='object'&&!Array.isArray(f)){fichas=f;var ae=document.activeElement;if(view==='estoque'&&stTab==='fichas'&&!(ae&&/^(INPUT|SELECT)$/.test(ae.tagName)))estoque()}}catch(e){}}}},function(){});

async function init(){
  document.body.dataset.mode=window.CAIXA_MODE;
  if(location.hash&&location.hash!=='#/'){try{history.replaceState(null,'',location.href.split('#')[0]+'#/')}catch(e){}}
  route();
  var d=null;try{d=await claude.use('db')}catch(e){}
  if(!d){dbState='off';authState=window.CAIXA_MODE==='firestore'?'offline':'ok';route();return}
  db=d;
  if(window.CAIXA_MODE==='firestore'){
    firebase.auth().onAuthStateChanged(function(u){
      if(!u){authState='login';role='';document.body.dataset.role='';route();return}
      var em=String(u.email||'').toLowerCase();
      role=em===U_CAIXA?'caixa':em===U_SALAO?'garcom':em===U_COZINHA?'cozinha':'';
      userName=role==='caixa'?'Caixa':role==='garcom'?'Salão':role==='cozinha'?'Cozinha':'';
      authState=role?'ok':'noaccess';dbState='ok';
      document.body.dataset.role=role;
      if(role)startApp();
      if(loginFlag){loginFlag=false;if(location.hash!==''&&location.hash!=='#/'){history.replaceState(null,'','#/')}}
      route();
    });
  }else{dbState='ok';authState='ok';role='caixa';document.body.dataset.role='caixa';startApp();route()}
}

document.addEventListener('click',async function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.classList.contains('fab')&&matchMedia('(hover:none)').matches&&!b.classList.contains('open')){
    document.querySelectorAll('.fab.open').forEach(function(x){x.classList.remove('open')});
    b.classList.add('open');setTimeout(function(){b.classList.remove('open')},3500);return}
  if(b.hasAttribute('data-go')){document.querySelectorAll('.fab.open').forEach(function(x){x.classList.remove('open')});location.hash='#/'+b.getAttribute('data-go');return}
  if(handlePed(b)||handleStock(b)||handleAuth(b)||handleSnd(b)||handleCx(b)||handleKitchen(b)||handleGastos(b)||handleViagem(b)||handlePrint(b))return;
  if(b.dataset.m){chosen=b.dataset.m;document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===b?'true':'false')});return}
  if(b.hasAttribute('data-rm')||b.id==='reset'){
    if(!b.hasAttribute('data-armed')){
      b.setAttribute('data-armed','1');b.textContent='Toque de novo para confirmar';
      setTimeout(function(){if(b.isConnected){b.removeAttribute('data-armed');b.textContent=b.dataset.label}},3500);return}
    b.disabled=true;
    try{
      if(b.id==='reset'){
        if(payments.length){
          var a={id:nightId,since:(night&&night.since)||payments[payments.length-1].ts,end:Date.now(),total:sum(payments),count:payments.length};
          METHODS.forEach(function(m,i){a[MK[i]]=sum(payments.filter(function(e){return e.method===m}))});
          await db.doc('noites/'+nightId).set(a);
        }
        await db.doc('config/noite').set({id:'n'+Date.now(),since:Date.now()});
      }
      else{
        var pid=b.getAttribute('data-rm'),pp=payments.filter(function(e){return e.id===pid})[0];
        await db.doc('pagamentos/'+pid).delete();
        if(pp&&pp.fid){try{await db.doc('fiado/'+pp.fid).delete()}catch(e){}}
        if(pp&&pp.conta){var oc=contasData()[pp.conta];if(oc&&oc.viagem){var sobra=payments.filter(function(e){return e.conta===pp.conta&&e.id!==pid}).length;oc.lines.forEach(function(l){db.doc('itens/'+l.id).update(sobra?{quitada:false}:{quitada:false,recebido:false}).catch(function(){})})}}
      }
    }catch(e){b.disabled=false;b.removeAttribute('data-armed');b.textContent='Não foi possível. Tentar de novo';if(e&&(e.code==='invalid_argument'||e.code==='permission-denied')){canWrite=false}}
  }
});
document.addEventListener('submit',async function(ev){
  ev.preventDefault();
  if(ev.target.id==='lf'){doLogin(ev);return}
  if(ev.target.id==='cf'){payConta(ev);return}
  var mesa=document.getElementById('mesa'),valor=document.getElementById('valor'),msg=document.getElementById('msg'),btn=ev.target.querySelector('.submit');
  var t=mesa.value.trim(),v=parseValue(valor.value);
  function fail(s,el){msg.className='msg err';msg.textContent=s;if(el)el.focus()}
  if(!t)return fail('Informe o número da mesa.',mesa);
  if(!chosen)return fail('Escolha a forma de pagamento.');
  if(v===null)return fail('Informe um valor maior que zero, como 45,50.',valor);
  if(!db)return fail('Sem conexão com o armazenamento compartilhado.');
  btn.disabled=true;var m=chosen;
  try{
    await db.collection('pagamentos').add({night:nightId,table:t,method:m,value:v,ts:Date.now()});
    msg.className='msg ok';msg.textContent='Registrado: mesa '+t+', '+m+', '+brl(v)+'.';
    mesa.value='';valor.value='';chosen=null;
    document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed','false')});
    mesa.focus();
  }catch(e){
    fail(e&&(e.code==='invalid_argument'||e.code==='permission-denied')?'Você não tem permissão para registrar pagamentos.':'Não foi possível registrar. Tente de novo.');
  }
  btn.disabled=false;
});
